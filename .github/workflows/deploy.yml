name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Allow only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

# Required permissions for the Pages deployment API
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This workflow is the only door between an edit and otianai.com: it runs on a push to main
      # and deploys, with no review in between. So the accessibility checks run here rather than in
      # a PR workflow nobody opens.
      #
      # Colour first, because it is the one that shipped broken for months without anybody
      # noticing: the focus ring measured 2.38 to 2.64:1 and field borders 1.36:1, which is a site
      # you cannot navigate by keyboard and forms whose boxes have no visible edge. The script
      # reads the real values out of css/styles.css, so nudging a token to taste fails here.
      - name: Check colour contrast
        run: node scripts/check-contrast.mjs

      # Every text box has to say what it is to something other than an eye. A placeholder is not a
      # name: it disappears on the first keystroke, and the pages this matters most on are the ones
      # people cannot skip, which is sign-in, password reset, and the account and security screens.
      - name: Check every input has an accessible name
        run: node scripts/check-input-labels.mjs

      # The same argument the block above makes for accessibility, made for claims.
      #
      # This site's product is trust, and TRUST.md opens by saying a false privacy or capability
      # claim costs more than every feature on the site combined. Until now nothing at this door
      # checked one: these three ran only when somebody remembered to run them, which is how
      # "Groq is free to start and needs no card" sat live on three pages after it stopped being
      # true. Groq's free tier allows 8,000 tokens a minute and one Archie turn needs ten to
      # eighteen thousand, so the sentence was true of the key and false of the product, and the
      # only thing standing between that and a reader was somebody noticing.
      #
      # All three are standard-library Python and finish in about a second each, so they cost
      # nothing on a normal push and stop the one push that matters.
      #
      # `check-csp.py` is deliberately NOT here. It loads every page in a real browser, one cold
      # browser per page in sequence, which is minutes rather than seconds, and its own self-test
      # currently reports the detector is not working. It wants fixing before it guards anything.
      - name: Check the figures against their sources
        run: python3 scripts/check-facts.py

      - name: Check no claim has drifted from TRUST.md
        run: python3 scripts/check-claim-drift.py

      - name: Check no page has outgrown its budget
        run: python3 scripts/check-copy-length.py

      # Directories in the repo but out of the upload, so their URLs return the 404 page.
      # A page written ahead of its feature goes here until the feature ships (business/
      # sat here until 2026-08-21); delete its name to publish it.
      #
      # firebase-hosting/ is not an unpublished page: it is the redirect stub Firebase Hosting serves on
      # archie-77170.firebaseapp.com (see firebase.json), and it has no business answering on
      # otianai.com as well.
      - name: Withhold unpublished pages
        run: rm -rf firebase-hosting

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the entire repo root as the site
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
