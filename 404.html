<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Otian AI</title>
  <meta name="description" content="That page isn't here. Head back to the Otian AI home page, or browse the marketplace." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/icon-1024-dark.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/icon-1024.png" />
  <script>
    /* Theme before first paint: saved choice, else the OS preference. */
    (function () {
      try {
        var t = localStorage.getItem("nr-theme");
        if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) { /* default light */ }
    })();
  </script>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    /* Page-scoped: a centered card, no nav machinery on a page whose one job is the way out. */
    .nf-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .nf-card {
      max-width: 460px;
      text-align: center;
    }
    .nf-card img {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      display: block;
    }
    .nf-code {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .nf-card h1 {
      margin: 10px 0 12px;
    }
    .nf-card p {
      color: var(--text-secondary);
      line-height: 1.65;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <main class="nf-wrap" id="main">
    <div class="nf-card">
      <img src="/assets/icon-1024-dark.svg" alt="Otian AI" />
      <div class="nf-code">404</div>
      <h1>That page isn't here</h1>
      <p>
        The address may have changed, or the link was mistyped. Everything we publish is still a
        click away.
      </p>
      <div class="btn-row">
        <a href="/" class="btn btn-primary">Go to the home page</a>
        <a href="/skills-marketplace/browse/" class="btn btn-secondary">Browse the marketplace</a>
      </div>
    </div>
  </main>
</body>
</html>
