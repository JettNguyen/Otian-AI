<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Otian AI</title>
  <!--
    A fallback, not a page. Everything on archie-77170.firebaseapp.com redirects to otianai.com
    (see the redirects block in firebase.json); this file is what would show if a redirect rule
    ever stopped matching. It carries no product or privacy claims on purpose, so it cannot go
    stale and contradict the real site: that contradiction is what put the previous snapshot in
    front of a Google OAuth reviewer.

    This host still signs people in. Firebase serves its own /__/auth/* paths here and they are
    not affected by anything in this directory.
  -->
  <meta http-equiv="refresh" content="0; url=https://otianai.com/" />
  <link rel="canonical" href="https://otianai.com/" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #16130F;
      color: #F4EFE9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    a { color: #E3B778; }
  </style>
</head>
<body>
  <p>Otian AI is at <a href="https://otianai.com/">otianai.com</a>.</p>
</body>
</html>
